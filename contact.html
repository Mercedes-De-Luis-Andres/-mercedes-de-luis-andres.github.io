<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact · Mercedes de Luis Andrés</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2b2b2b;
            --accent-color: #7d6b5d;
            --line-color: #e5e2dc;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            max-width: 720px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .back-link {
            font-size: 0.95rem;
            text-decoration: none;
            color: var(--accent-color);
            display: inline-block;
            margin-bottom: 2.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-color);
        }

        h1 {
            font-size: 2rem;
            font-weight: normal;
            letter-spacing: -0.5px;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--line-color);
            padding-bottom: 1rem;
        }

        .contact-item {
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }

        .contact-label {
            font-size: 0.9rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        a {
            color: var(--text-color);
            text-decoration: underline;
        }

        a:hover {
            color: var(--accent-color);
        }

        footer {
            border-top: 1px solid var(--line-color);
            padding-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-top: 5rem;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Mercedes de Luis Andrés</a>

    <main>
        <h1>Contact</h1>

        <div class="contact-item">
            <div class="contact-label">Email</div>
            <a href="mailto:mercedesdel@edu.aau.at">mercedesdel@edu.aau.at</a>
        </div>

        <div class="contact-item">
            <div class="contact-label">ORCID</div>
            <span>0000-0002-7141-2323</span>
        </div>

        <div class="contact-item">
            <div class="contact-label">Portfolio</div>
            <a href="https://linktr.ee/mercedesdeluisandres" target="_blank" rel="noopener">https://linktr.ee/mercedesdeluisandres</a>
        </div>
    </main>

    <footer>
        <p>Mercedes de Luis Andrés</p>
    </footer>

</body>
</html>
